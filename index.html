<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صناعة المدن والمشاريع العقارية الناجحة</title>

    <link rel="stylesheet" href="stely.css">
</head>

<body>

    <header class="topbar">
        <div class="logo">REAL<span>+</span> ESTATE</div>
        <div class="top-label">من الأرض إلى مدينة المستقبل</div>
    </header>

    <main class="presentation">
        <div class="slide-number" id="number"></div>
        <div id="slide-content"></div>
    </main>

    <footer class="controls">
        <button id="prev">السابق ←</button>
        <div class="progress">
            <div id="progress"></div>
        </div>
        <span id="counter"></span>
        <button id="next">التالي →</button>
    </footer>

    <script>

        const slides = [

            {
                title: "كيف تُصنع المدن والمشاريع العقارية الناجحة؟",
                subtitle: "من اختيار الأرض إلى الاستثمار والتطوير والتشغيل",
                text: "المشروع العقاري الناجح ليس مجرد مبنى جميل.\n\nإنه منظومة متكاملة تجمع بين دراسة السوق، واختيار الموقع، والتصميم الهندسي، والتمويل، والتنفيذ، والإدارة.\n\nفي هذا العرض نكتشف كيف تتحول الأرض إلى أصل عقاري يحقق قيمة اقتصادية واجتماعية.",
                note: "الفكرة الأساسية: التطوير العقاري هو صناعة قيمة، وليس مجرد عملية بناء.",
                image: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1200"
            },

            {
                title: "ما هو التطوير العقاري؟",
                text: "التطوير العقاري هو عملية تحويل الأراضي أو العقارات إلى مشاريع ذات قيمة أعلى.\n\nقد يشمل:\n• شراء الأرض.\n• دراسة الجدوى.\n• إعداد التصاميم.\n• الحصول على التراخيص.\n• التمويل والتنفيذ.\n• التسويق والبيع أو التأجير.\n• إدارة وتشغيل المشروع.",
                note: "المطور العقاري يدير دورة حياة المشروع من الفكرة حتى التشغيل أو البيع.",
                image: "https://images.unsplash.com/photo-1487958449943-2429e8be8625?w=1200"
            },

            {
                title: "لماذا تنجح بعض المشاريع وتفشل أخرى؟",
                text: "قد يكون المبنى جميلًا ومكلفًا، لكنه لا يجد مشترين أو مستأجرين.\n\nوقد ينجح مشروع بسيط لأنه يلبي احتياجًا حقيقيًا في منطقة مناسبة.\n\nأهم عوامل النجاح:\n• فهم احتياجات السوق.\n• اختيار الموقع.\n• ضبط التكاليف.\n• التسعير المناسب.\n• إدارة المخاطر.",
                note: "جودة المشروع لا تقاس بجمال المبنى فقط، بل بقدرته على تحقيق أهدافه.",
                image: "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=1200"
            },

            {
                title: "دراسة السوق العقاري",
                text: "قبل شراء الأرض، يجب فهم السوق الذي سيدخل إليه المشروع.\n\nنبحث عن:\n• حجم الطلب على الوحدات.\n• نوع العملاء المستهدفين.\n• متوسط الأسعار.\n• المشاريع المنافسة.\n• معدلات الإشغال.\n• العرض المتاح في المنطقة.",
                note: "السؤال الأهم: من سيشتري أو يستأجر هذا المشروع؟ ولماذا؟",
                image: "https://images.unsplash.com/photo-1460472178825-e5240623afd5?w=1200"
            },

            {
                title: "اختيار الموقع المناسب",
                text: "الموقع قد يكون أحد أهم عوامل نجاح الاستثمار العقاري.\n\nيتم تقييم الموقع من خلال:\n• القرب من الطرق الرئيسية.\n• توفر الخدمات.\n• سهولة الوصول.\n• المدارس والمستشفيات.\n• فرص النمو العمراني.\n• طبيعة المنطقة المحيطة.",
                note: "الموقع الجيد لا يعني فقط موقعًا مشهورًا؛ بل موقعًا يناسب نوع المشروع وعملاءه.",
                image: "https://images.unsplash.com/photo-1511818966892-d7d671e672a2?w=1200"
            },

            {
                title: "كيف نحدد نوع المشروع؟",
                text: "بعد دراسة السوق والموقع نحدد الاستخدام الأنسب للأرض.\n\nأمثلة:\n• مشروع سكني.\n• مشروع تجاري.\n• مكاتب إدارية.\n• مجمع متعدد الاستخدامات.\n• مشروع ضيافة وفندقة.\n\nيجب أن يتوافق نوع المشروع مع الطلب والأنظمة وإمكانات الموقع.",
                note: "لا تختَر نوع المشروع لأنك تحبه؛ اختره لأن السوق والموقع يدعمانه.",
                image: "https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?w=1200"
            },

            {
                title: "التصميم والتخطيط العمراني",
                text: "التصميم الجيد يوازن بين الجمال والوظيفة والتكلفة.\n\nمن عناصر التخطيط:\n• توزيع المساحات.\n• حركة السيارات والمشاة.\n• مواقف المركبات.\n• الإضاءة والتهوية.\n• المساحات الخضراء.\n• سهولة الاستخدام والصيانة.",
                note: "التصميم الناجح يجعل المكان عمليًا ومريحًا وقابلًا للاستمرار.",
                image: "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=1200"
            },

            {
                title: "دراسة الجدوى الاقتصادية",
                text: "دراسة الجدوى تساعد المستثمر على معرفة ما إذا كان المشروع قابلًا للتنفيذ اقتصاديًا.\n\nتتضمن:\n• تكلفة شراء الأرض.\n• تكاليف التصميم والتراخيص.\n• تكلفة البناء.\n• تكاليف التمويل.\n• الإيرادات المتوقعة.\n• المصروفات التشغيلية.\n• العائد والمخاطر.",
                note: "لا تبدأ التنفيذ قبل أن تعرف كيف ستغطي التكاليف وكيف سيحقق المشروع إيراداته.",
                image: "https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=1200"
            },

            {
                title: "كيف نحسب تكلفة المشروع؟",
                text: "لنفترض أن مشروعًا افتراضيًا يتكون من:\n\nالأرض: 4,000,000 ريال.\nالبناء: 8,000,000 ريال.\nالتصميم والتراخيص: 500,000 ريال.\nالتسويق والإدارة: 500,000 ريال.\n\nإجمالي التكلفة التقديرية: 13,000,000 ريال.",
                note: "هذه أرقام تعليمية افتراضية لتوضيح طريقة الحساب، وليست أسعارًا فعلية للسوق.",
                image: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1200"
            },

            {
                title: "الإيرادات والعائد الاستثماري",
                text: "لنفترض أن المشروع يضم 20 وحدة سكنية.\n\nإذا كان متوسط سعر بيع الوحدة 800,000 ريال:\n\nإجمالي الإيرادات = 20 × 800,000\n\nإجمالي الإيرادات الافتراضية = 16,000,000 ريال.\n\nالربح التقديري قبل الضرائب وأي بنود إضافية = 3,000,000 ريال.",
                note: "الربح التقديري لا يساوي العائد النهائي للمستثمر؛ يجب احتساب التمويل والضرائب والرسوم والمخاطر.",
                image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1200"
            },

            {
                title: "إدارة المخاطر العقارية",
                text: "المشاريع العقارية تواجه مخاطر متعددة:\n\n• ارتفاع أسعار مواد البناء.\n• تأخر التنفيذ.\n• ضعف الطلب.\n• تغير أسعار التمويل.\n• مشكلات المقاولين.\n• تغير المتطلبات التنظيمية.\n\nتتم إدارة المخاطر بالتخطيط والاحتياطيات والمتابعة المستمرة.",
                note: "المطور المحترف لا يفترض أن كل شيء سيسير كما خُطط له؛ بل يستعد للسيناريوهات المختلفة.",
                image: "https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=1200"
            },

            {
                title: "من المخطط إلى البناء",
                text: "مرحلة التنفيذ تحتاج إلى تنسيق دقيق بين:\n\n• المالك والمطور.\n• المهندس المعماري.\n• المهندس الإنشائي.\n• المقاول.\n• الاستشاري.\n• الجهات المختصة.\n\nوتشمل مراقبة الجودة والوقت والميزانية والسلامة.",
                note: "تأخير التنفيذ قد يزيد التكاليف ويؤخر الإيرادات المتوقعة.",
                image: "https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=1200"
            },

            {
                title: "المدن الذكية والاستدامة",
                text: "المشاريع الحديثة لا تركز على المباني فقط، بل على جودة الحياة.\n\nمن عناصر الاستدامة:\n• ترشيد استهلاك الطاقة.\n• كفاءة المياه.\n• المساحات الخضراء.\n• سهولة التنقل.\n• المباني الذكية.\n• تقليل النفايات.",
                note: "الاستدامة يمكن أن تقلل تكاليف التشغيل وتحسن تجربة السكان على المدى الطويل.",
                image: "https://images.unsplash.com/photo-1518005020951-eccb494ad742?w=1200"
            },

            {
                title: "دراسة حالة افتراضية: مشروع سكني",
                text: "مطور يدرس إنشاء مشروع سكني في منطقة نامية.\n\nالخطوات:\n1. تحليل الطلب في المنطقة.\n2. مقارنة المواقع والأراضي.\n3. تحديد عدد الوحدات ومساحاتها.\n4. إعداد الميزانية.\n5. اختيار المقاول.\n6. تنفيذ المشروع.\n7. التسويق والبيع.\n\nبعد التنفيذ تتم مقارنة النتائج بالخطة الأصلية.",
                note: "نجاح المشروع يعتمد على ترابط قرارات السوق والتصميم والتمويل والتنفيذ.",
                image: "https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=1200"
            },

            {
                title: "الخلاصة: كيف نصنع مشروعًا ناجحًا؟",
                text: "افهم السوق أولًا.\n\nاختر الموقع بعناية.\n\nحدد المنتج العقاري المناسب.\n\nاحسب التكلفة والعائد.\n\nخطط للمخاطر.\n\nراقب التنفيذ والجودة.\n\nاهتم بالتشغيل والاستدامة.\n\nقِس النتائج بعد اكتمال المشروع.",
                note: "السؤال الختامي: هل الأفضل شراء أرض رخيصة في موقع ضعيف، أم أرض أعلى سعرًا في موقع يلبي طلبًا حقيقيًا؟ ولماذا؟",
                image: "https://images.unsplash.com/photo-1487958449943-2429e8be8625?w=1200"
            }

        ];

        let current = 0;

        const content = document.getElementById("slide-content");
        const number = document.getElementById("number");
        const counter = document.getElementById("counter");
        const progress = document.getElementById("progress");

        function showSlide() {

            const slide = slides[current];

            number.textContent = "CHAPTER / " + (current + 1);

            content.innerHTML = `
    <h1>${slide.title}</h1>
    ${slide.subtitle ? `<h2>${slide.subtitle}</h2>` : ""}

    <div class="slide-layout">

      <div class="slide-text">
        <p>${slide.text}</p>
        <div class="note">${slide.note}</div>
      </div>

      <div class="slide-image">
        <img
          src="${slide.image}"
          alt="${slide.title}"
          onerror="this.alt='تعذر تحميل الصورة'; this.style.display='none';">
      </div>

    </div>
  `;

            counter.textContent = `${current + 1} / ${slides.length}`;

            progress.style.width =
                ((current + 1) / slides.length * 100) + "%";

            document.getElementById("prev").disabled = current === 0;

            document.getElementById("next").disabled =
                current === slides.length - 1;
        }

        document.getElementById("next").onclick = () => {
            if (current < slides.length - 1) {
                current++;
                showSlide();
            }
        };

        document.getElementById("prev").onclick = () => {
            if (current > 0) {
                current--;
                showSlide();
            }
        };

        document.addEventListener("keydown", event => {

            if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
                document.getElementById("next").click();
            }

            if (event.key === "ArrowRight" || event.key === "ArrowUp") {
                document.getElementById("prev").click();
            }

        });

        showSlide();

    </script>

</body>

</html>
